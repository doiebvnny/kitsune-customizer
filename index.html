<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AJPW Pet Kitsune Customizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="title-banner wood-panel">
      <div class="title-inner">Kitsune Customizer</div>
    </header>

    <section class="customizer-layout">
      <div class="controls-column">
        <section class="wood-panel control-panel">
          <h2>Tail Number</h2>
          <div class="choice-row" id="tailNumberChoices">
            <button class="choice-tile selected" data-value="three" title="Three tails">3</button>
            <button class="choice-tile" data-value="five" title="Five tails">5</button>
            <button class="choice-tile" data-value="seven" title="Seven tails">7</button>
            <button class="choice-tile" data-value="one" title="One tail">1</button>
            <button class="choice-tile" data-value="nine" title="Nine tails">9</button>
          </div>
        </section>

        <section class="wood-panel control-panel">
          <h2>Tail Type</h2>
          <div class="choice-row" id="tailTypeChoices">
            <button class="choice-tile selected" data-value="mystic">Mystic</button>
            <button class="choice-tile" data-value="fateful">Fateful</button>
            <button class="choice-tile" data-value="splendorous">Splendorous</button>
            <button class="choice-tile" data-value="valiant">Valiant</button>
            <button class="choice-tile" data-value="hazy">Hazy</button>
            <button class="choice-tile" data-value="endless">Endless</button>
          </div>
        </section>

        <div class="two-col">
          <section class="wood-panel control-panel">
            <h2>Pattern</h2>
            <div class="choice-row compact">
              <button class="choice-tile disabled" disabled>Coming soon</button>
            </div>
          </section>

          <section class="wood-panel control-panel">
            <h2>Ruff</h2>
            <div class="choice-row compact">
              <button class="choice-tile disabled" disabled>Coming soon</button>
            </div>
          </section>
        </div>

        <div class="two-col">
          <section class="wood-panel control-panel">
            <h2>Ears</h2>
            <div class="choice-row compact">
              <button class="choice-tile disabled" disabled>Coming soon</button>
            </div>
          </section>

          <section class="wood-panel control-panel">
            <h2>Mask</h2>
            <div class="choice-row compact">
              <button class="choice-tile disabled" disabled>Coming soon</button>
            </div>
          </section>
        </div>

        <section class="color-box-row">
          <button class="wood-panel color-box" data-color-target="primary">
            <span class="color-label">Primary</span>
            <span class="swatch" id="primarySwatch"></span>
          </button>

          <button class="wood-panel color-box" data-color-target="secondary">
            <span class="color-label">Secondary</span>
            <span class="swatch" id="secondarySwatch"></span>
          </button>

          <button class="wood-panel color-box" data-color-target="tertiary">
            <span class="color-label">Tertiary</span>
            <span class="swatch" id="tertiarySwatch"></span>
          </button>

          <button class="wood-panel color-box" data-color-target="eye">
            <span class="color-label">Eye Color</span>
            <span class="swatch" id="eyeSwatch"></span>
          </button>
        </section>
      </div>

      <section class="preview-paper">
        <h2>Preview</h2>
        <div class="preview-stage">
          <div class="placeholder" id="placeholder">
            <div class="fox">🦊</div>
            <strong>Preview</strong>
            <span id="summaryText">Mystic • Three tails</span>
          </div>

          <img id="tailLayer" class="pet-layer" alt="" />
        </div>

        <div class="preview-actions">
          <button id="randomizeBtn" class="paper-btn">↝ Randomize</button>
          <button id="resetBtn" class="paper-btn">↻ Reset</button>
        </div>
      </section>
    </section>

    <p class="footer-note">Fan-made customizer. Not affiliated with WildWorks or Animal Jam.</p>
  </main>

  <div class="modal-backdrop" id="colorModal" hidden>
    <section class="color-modal" role="dialog" aria-modal="true" aria-labelledby="colorModalTitle">
      <div class="color-modal-header">
        <h2 id="colorModalTitle">Choose Primary Color</h2>
        <button id="closeColorModal" class="close-btn" aria-label="Close color picker">×</button>
      </div>

      <div class="wheel-wrap">
        <div class="color-wheel" id="colorWheel" aria-label="AJPW-style color palette"></div>
      </div>

      <div class="color-modal-footer">
        <span>Selected:</span>
        <span class="selected-preview" id="selectedPreview"></span>
        <code id="selectedHex"></code>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
